[project]
name = "recruitment-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6.18.1,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
