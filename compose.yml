services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: ${PGUSER:-recruitment}
      POSTGRES_PASSWORD: ${PGPASSWORD:?请先配置 apps/api/.env 中的数据库密码}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - recruitment-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d recruitment']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  recruitment-postgres:
